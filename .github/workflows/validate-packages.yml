name: Validate Custom Packages

# 只编自定义包，不编整机镜像，用来先确认 daed / lucky / adguardhome 在 AN7581 上编得通。
# 预计 45~90 分钟（大头是首次构建 toolchain），失败了日志短、定位快。

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '要验证的包（空格分隔，留空=全部）'
        required: false
        default: ''
        type: string

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules /usr/share/swift /usr/lib/jvm
          df -h /

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang llvm lld gcc g++ binutils bzip2 gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc \
            zlib1g-dev file which perl sed make
          clang --version
          llc --version | head -3

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh

      - name: Select feed providers and patch
        run: |
          FEED_PATCHES_STRICT=1 bash scripts/select-feed-providers.sh
          FEED_PATCHES_STRICT=1 bash scripts/apply-feed-patches.sh

      - name: Remove duplicate lucky from feeds
        run: |
          for n in lucky luci-app-lucky; do
            find feeds -name Makefile -exec grep -l "PKG_NAME:=$n\$" {} \; 2>/dev/null | while read -r mk; do
              src_dir="$(dirname "$mk")"
              echo "move $src_dir"
              mv "$src_dir" "${src_dir}.disabled-by-custom"
            done
          done

      - name: Configure
        run: |
          cp my-2010.config .config
          make defconfig
          grep -E '^CONFIG_PACKAGE_(adguardhome|luci-app-adguardhome|daed|luci-app-daed|lucky|luci-app-lucky)=' .config || true

      - name: Build toolchain
        run: make -j"$(nproc)" toolchain/install BUILD_LOG=1 2>&1 | tail -50

      - name: Build packages
        shell: bash
        env:
          WANT: ${{ inputs.packages }}
        run: |
          set -o pipefail
          if [ -z "$WANT" ]; then
            WANT="package/custom/lucky package/custom/luci-app-lucky package/custom/daed package/custom/luci-app-daed"
            AGH="$(find -L package/feeds -maxdepth 4 -type d -name adguardhome 2>/dev/null | head -1)"
            AGL="$(find -L package/feeds -maxdepth 4 -type d -name luci-app-adguardhome 2>/dev/null | head -1)"
            [ -n "$AGH" ] && WANT="$WANT $AGH" || echo "未找到 feeds 里的 adguardhome，跳过"
            [ -n "$AGL" ] && WANT="$WANT $AGL" || echo "未找到 feeds 里的 luci-app-adguardhome，跳过"
          fi
          echo "目标：$WANT"
          for t in $WANT; do
            echo "=== $t ==="
            if ! make "$t/compile" V=s BUILD_LOG=1 2>&1 | tee "log-$(basename "$t").txt" | tail -80; then
              echo "!! $t 编译失败"
              exit 1
            fi
            echo "OK $t"
          done

      - name: Show artifacts
        if: always()
        run: |
          echo "== bin/packages =="
          find bin/packages -name '*.apk' -newermt '-6 hours' 2>/dev/null | head -30
          find bin/packages -name 'daed*' -o -name 'lucky*' -o -name 'adguardhome*' 2>/dev/null | head -40
          echo "== 体积 =="
          du -sh bin/ 2>/dev/null || true

      - name: Upload built packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validated-apks
          path: |
            bin/packages/**/*.apk
            log-*.txt
          retention-days: 14
          if-no-files-found: warn
